name: Build Godot Release for PortMaster (Native ARM64)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  SCONS_CACHE_LIMIT: 7168

permissions:
  contents: write
  actions: write

jobs:
  build_portmaster:
    name: Build Godot Binaries
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Create SCons Cache Directory
        run: mkdir -p ${{ github.workspace }}/.scons-cache

      - name: Restore SCons Cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.scons-cache
          key: ${{ runner.os }}-scons-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-scons-v1-

      - name: Build Local Builder Image
        run: docker build -f .github/Dockerfile -t local-builder .

      - name: Compile 3D Full
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e SCONS_CACHE=/workspace/.scons-cache \
            --user $(id -u):$(id -g) \
            local-builder \
            scons -j$(nproc) platform=linuxbsd arch=arm64 target=template_release optimize=speed production=yes lto=full disable_path_overrides=no use_static_cpp=yes tools=no deprecated=no minizip=yes module_lightmapper_rd_enabled=no disable_exceptions=yes disable_rtti=yes

      - name: Prepare 3D Full
        run: |
          cd bin/
          strip $(ls godot.linuxbsd.template_release.arm64*)
          mv $(ls godot.linuxbsd.template_release.arm64*) godot_3d.aarch64

      - name: Compile Compat (Maximum 2D Compatibility)
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e SCONS_CACHE=/workspace/.scons-cache \
            --user $(id -u):$(id -g) \
            local-builder \
            scons -j$(nproc) platform=linuxbsd arch=arm64 target=template_release optimize=speed production=yes lto=full disable_path_overrides=no use_static_cpp=yes tools=no deprecated=no minizip=yes module_basis_universal_enabled=yes module_msdfgen_enabled=yes module_svg_enabled=yes module_text_server_advanced_enabled=yes module_gltf_enabled=no module_gridmap_enabled=no module_openxr_enabled=no module_raycast_enabled=no module_lightmapper_rd_enabled=no disable_exceptions=yes disable_rtti=yes

      - name: Prepare Compat
        run: |
          cd bin/
          strip $(ls godot.linuxbsd.template_release.arm64*)
          mv $(ls godot.linuxbsd.template_release.arm64*) godot_compat.aarch64

      - name: Compile Optimised (Pure Speed 2D)
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e SCONS_CACHE=/workspace/.scons-cache \
            --user $(id -u):$(id -g) \
            local-builder \
            scons -j$(nproc) platform=linuxbsd arch=arm64 target=template_release optimize=speed production=yes lto=full disable_path_overrides=no use_static_cpp=yes tools=no disable_advanced_gui=yes deprecated=no minizip=yes module_basis_universal_enabled=yes module_gltf_enabled=no module_gridmap_enabled=no module_msdfgen_enabled=no module_openxr_enabled=no module_raycast_enabled=no module_svg_enabled=no module_lightmapper_rd_enabled=no module_text_server_advanced_enabled=no module_text_server_fallback_enabled=yes disable_3d=yes disable_exceptions=yes disable_rtti=yes

      - name: Prepare Optimised
        run: |
          cd bin/
          strip $(ls godot.linuxbsd.template_release.arm64*)
          mv $(ls godot.linuxbsd.template_release.arm64*) godot_optimised.aarch64

      - uses: actions/upload-artifact@v5
        with:
          name: godot_3d.aarch64
          path: bin/godot_3d.aarch64

      - uses: actions/upload-artifact@v5
        with:
          name: godot_compat.aarch64
          path: bin/godot_compat.aarch64

      - uses: actions/upload-artifact@v5
        with:
          name: godot_optimised.aarch64
          path: bin/godot_optimised.aarch64
