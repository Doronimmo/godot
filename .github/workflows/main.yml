name: Build Linux (arm64) desktop export template (Godot 4.3)
on:
  push:
    branches:
      - '*'            # triggers on any branch
  workflow_dispatch:   # allows manual runs

jobs:
  build-arm64-desktop:
    name: Build Linux aarch64 desktop export template (QEMU/emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build inside arm64 container (buildx)
        env:
          SCONS_ARGS: "platform=x11 target=release tools=no bits=64 arch=arm64"
        run: |
          # Build an arm64 image that clones the checked-out repo (context provided by checkout) and builds inside an arm64 Ubuntu container.
          docker buildx build --platform linux/arm64 -t godot-arm64-build --load -f- . <<'DOCKERFILE'
          FROM ubuntu:22.04
          ARG DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential git python3 python3-distutils scons pkg-config \
              libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
              libxkbcommon-dev libgl1-mesa-dev libvulkan-dev libasound2-dev \
              libpulse-dev libudev-dev libpng-dev yasm libssl-dev ca-certificates \
            && rm -rf /var/lib/apt/lists/*
          WORKDIR /build
          COPY . /build
          # Adjust -j if you hit memory/time limits (e.g., replace -j$(nproc) with -j2)
          RUN scons -j$(nproc) ${SCONS_ARGS}
          RUN mkdir -p /out && cp -a bin/* /out || true
          DOCKERFILE

      - name: Extract build artifacts from image
        run: |
          container=$(docker create godot-arm64-build)
          docker cp "$container":/out ./out || true
          docker rm -v "$container" || true
          ls -la ./out || true

      - name: Upload export template artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-arm64-desktop
          path: ./out

# Notes:
# - This builds the desktop (X11) export template for aarch64 (tools=no). For Wayland set SCONS_ARGS to use platform=wayland.
# - Emulated arm64 builds on ubuntu-latest are slower; consider a self-hosted arm64 runner for faster builds.
# - For Godot 4.3 this should work out of the box; if your fork adds extra dependencies, update the apt package list above.
